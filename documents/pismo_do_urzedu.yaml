id: pismo_do_urzedu
title_pl: "Pismo do urzędu (szablon)"
title_ru: "Письмо в urząd (шаблон)"
title_en: "Letter to the office (template)"
title_ua: "Лист до urzędu (шаблон)"
description_ru: "Официальное письмо на польском: ответ на wezwanie, пояснение или просьба. Распечатайте, подпишите и приложите копии."
description_en: "Official Polish letter: reply to a summons, explanation, or request. Print, sign, and attach copies."
description_pl: "Szablon pisma urzędowego po polsku. Wydrukuj, podpisz i dołącz załączniki."
description_ua: "Офіційний лист польською: відповідь на wezwanie, пояснення або прохання."
