id: upowaznienie
title_pl: "Upoważnienie / pełnomocnictwo (szablon)"
title_ru: "Доверенность / upoważnienie (шаблон)"
title_en: "Authorization / power of attorney (template)"
title_ua: "Довіреність / upoważnienie (шаблон)"
description_ru: "Простой шаблон upoważnienia: кто, кого и к чему уполномочивает. Не заменяет нотариальное pełnomocnictwo, если urząd требует акт notarialny."
description_en: "Simple authorization template. Not a notarial power of attorney if the office requires one."
description_pl: "Szablon upoważnienia. Nie zastępuje pełnomocnictwa notarialnego, jeśli urząd tego wymaga."
description_ua: "Простий шаблон upoważnienia. Не замінює нотаріальне pełnomocnictwo."
