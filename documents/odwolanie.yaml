id: odwolanie
title_pl: "Odwołanie od decyzji (szablon)"
title_ru: "Обжалование решения / odwołanie (шаблон)"
title_en: "Appeal against a decision (template)"
title_ua: "Оскарження рішення / odwołanie (шаблон)"
description_ru: "Черновик odwołania на польском. Проверьте срок в решении (часто 14 дней) и орган, куда подавать. Не юридическая консультация."
description_en: "Draft appeal in Polish. Check the deadline in the decision (often 14 days) and the authority. Not legal advice."
description_pl: "Szablon odwołania. Sprawdź termin w decyzji i organ odwoławczy. To nie porada prawna."
description_ua: "Чернетка odwołania польською. Перевірте строк у рішенні та орган. Не юридична консультація."
